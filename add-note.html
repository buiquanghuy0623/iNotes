<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Mới Ghi Chú</title>
</head>
<body>
    <h2>Thêm Mới Ghi Chú</h2>
    <form action="save-note" method="POST">
        <div>
            <label>Tiêu đề:</label><br>
            <input type="text" name="title" required style="width: 300px;">
        </div>
        <div>
            <label>Phân loại:</label><br>
            <select name="typeId">
                <option value="1">Cá nhân</option>
                <option value="2">Công việc</option>
                <option value="3">Học tập</option>
            </select>
        </div>
        <div>
            <label>Nội dung:</label><br>
            <textarea name="content" rows="5" cols="40"></textarea>
        </div>
        <br>
        <button type="submit">Lưu Ghi Chú</button>
        <a href="dashboard.html"><button type="button">Hủy bỏ</button></a>
    </form>
</body>
</html>
